name: Update contribution stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contributions card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: kritikaaverse
        run: |
          python3 - <<'PY'
          import json, os, datetime, urllib.request

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          now = datetime.datetime.now(datetime.timezone.utc)
          start = now - datetime.timedelta(days=365)
          fmt = "%Y-%m-%dT%H:%M:%SZ"

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
            }
          }"""

          payload = json.dumps({
              "query": query,
              "variables": {"login": user, "from": start.strftime(fmt), "to": now.strftime(fmt)},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={"Authorization": f"bearer {token}", "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)

          if "errors" in data or not data.get("data", {}).get("user"):
              raise SystemExit(f"GitHub API error: {data}")

          cal = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          total = cal["totalContributions"]

          today = now.strftime("%Y-%m-%d")
          days = sorted(
              (d for w in cal["weeks"] for d in w["contributionDays"] if d["date"] <= today),
              key=lambda d: d["date"],
          )
          counts = [d["contributionCount"] for d in days]

          longest = run = 0
          for c in counts:
              run = run + 1 if c > 0 else 0
              longest = max(longest, run)

          # Current streak: count back from today, or from yesterday if today has no contributions yet.
          i = len(counts) - 1
          if i >= 0 and counts[i] == 0:
              i -= 1
          current = 0
          while i >= 0 and counts[i] > 0:
              current += 1
              i -= 1

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contributions: {total} in the last year, current streak {current} days, longest streak {longest} days">
            <rect width="495" height="195" rx="10" fill="#10070C" stroke="#451126" stroke-width="1"/>
            <line x1="165" y1="40" x2="165" y2="160" stroke="#C77B9B" stroke-opacity="0.4"/>
            <line x1="330" y1="40" x2="330" y2="160" stroke="#C77B9B" stroke-opacity="0.4"/>
            <g font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" text-anchor="middle">
              <text x="82" y="82" font-size="36" font-weight="700" fill="#F8F0F3">{total}</text>
              <text x="82" y="112" font-size="14" fill="#C77B9B">Total Contributions</text>
              <text x="82" y="130" font-size="12" fill="#C77B9B" fill-opacity="0.7">last 12 months</text>

              <circle cx="247" cy="80" r="38" fill="none" stroke="#C77B9B" stroke-width="4"/>
              <text x="247" y="90" font-size="30" font-weight="700" fill="#F8F0F3">{current}</text>
              <text x="247" y="140" font-size="14" font-weight="700" fill="#C77B9B">Current Streak</text>

              <text x="412" y="82" font-size="36" font-weight="700" fill="#F8F0F3">{longest}</text>
              <text x="412" y="112" font-size="14" fill="#C77B9B">Longest Streak</text>
              <text x="412" y="130" font-size="12" fill="#C77B9B" fill-opacity="0.7">days</text>
            </g>
          </svg>
          '''

          os.makedirs("assets", exist_ok=True)
          with open("assets/contributions.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          print(f"total={total} current={current} longest={longest}")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo "No change in contribution stats."
          else
            git commit -m "Update contribution stats"
            git push
          fi
