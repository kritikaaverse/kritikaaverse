<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="kh-title kh-desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="kh-title">Kritika Sahu, Software Dev</title>
  <desc id="kh-desc">Animated burgundy banner with a glowing signal path, orbital geometry and a fine technical grid.</desc>
  <defs>
    <linearGradient id="kh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.6" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="kh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kh-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="kh-underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="kh-fade" cx="0.6" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <pattern id="kh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#451126" stroke-width="1"/>
    </pattern>
    <mask id="kh-gridmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="320">
      <rect width="1200" height="320" fill="url(#kh-fade)"/>
    </mask>
    <filter id="kh-glow-f" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#kh-bg)"/>
  <rect width="1200" height="320" fill="url(#kh-grid)" opacity="0.35" mask="url(#kh-gridmask)"/>

  <circle cx="860" cy="160" r="280" fill="url(#kh-glow)" opacity="0.7">
    <animate attributeName="cx" values="820;900;820" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="300" r="230" fill="url(#kh-glow)" opacity="0.45">
    <animate attributeName="cy" values="300;250;300" dur="20s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="860" cy="160" rx="300" ry="105" fill="none" stroke="#C77B9B" stroke-opacity="0.28" stroke-width="1"/>
  <ellipse cx="860" cy="160" rx="200" ry="140" fill="none" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0 860 160" to="360 860 160" dur="60s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="4" fill="#E5B5C7" filter="url(#kh-glow-f)">
    <animateMotion dur="14s" repeatCount="indefinite" path="M560 160 A300 105 0 1 0 1160 160 A300 105 0 1 0 560 160"/>
  </circle>

  <path d="M0 262 C120 236 190 292 300 262 S470 226 560 262 S740 302 860 252 S1040 204 1200 246" fill="none" stroke="#701A3D" stroke-width="1" stroke-opacity="0.45"/>
  <path d="M0 262 C120 236 190 292 300 262 S470 226 560 262 S740 302 860 252 S1040 204 1200 246" fill="none" stroke="url(#kh-signal)" stroke-width="2.5" stroke-linecap="round" filter="url(#kh-glow-f)" stroke-dasharray="1600" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="3s" begin="0s" fill="freeze"/>
  </path>
  <path d="M0 262 C120 236 190 292 300 262 S470 226 560 262 S740 302 860 252 S1040 204 1200 246" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" stroke-dasharray="70 1530" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <g stroke="#C77B9B" stroke-opacity="0.5" stroke-width="1">
    <path d="M24 24 H36 M30 18 V30"/>
    <path d="M1164 24 H1176 M1170 18 V30"/>
    <path d="M24 296 H36 M30 290 V302"/>
    <path d="M1164 296 H1176 M1170 290 V302"/>
  </g>
  <text x="72" y="58" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#C77B9B" fill-opacity="0.8" letter-spacing="3">PROFILE / 01</text>

  <text x="72" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#F8F0F3" letter-spacing="1">Kritika Sahu</text>
  <text x="74" y="188" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#C77B9B" letter-spacing="3">SOFTWARE DEV · HARDWARE &amp; BIOMEDICAL</text>
  <rect x="72" y="208" width="380" height="2" fill="url(#kh-underline)" filter="url(#kh-glow-f)">
    <animate attributeName="width" from="0" to="380" dur="1.6s" begin="0s" fill="freeze"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
